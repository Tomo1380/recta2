<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Recta LINE 公式アカウントアイコン用。
       LINE は受け取った画像を円形にマスクして表示する。四隅の三角が
       透明だと LINE 側で「白」に置き換えられて違和感が出るため、
       favicon と違って角丸を持たず、四隅まで完全に dark で塗りつぶす。
       配色は favicon.svg と同じ (ダーク背景 + ゴールドの Great Vibes "R")。 -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1b2528"/>
      <stop offset="60%" stop-color="#0f1618"/>
      <stop offset="100%" stop-color="#050708"/>
    </radialGradient>
    <radialGradient id="goldOrb" cx="80%" cy="40%" r="65%">
      <stop offset="0%" stop-color="rgba(212,175,55,0.22)"/>
      <stop offset="100%" stop-color="rgba(212,175,55,0)"/>
    </radialGradient>
  </defs>

  <!-- 角丸 なし: LINE 円形マスクと白塗りに耐えるよう全面 dark -->
  <rect x="0" y="0" width="32" height="32" fill="url(#bg)"/>
  <rect x="0" y="0" width="32" height="32" fill="url(#goldOrb)"/>

