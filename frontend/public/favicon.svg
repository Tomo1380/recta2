<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Recta favicon: ダーク背景 (#1b2528) のラウンドスクエア +
       ゴールド (#D4AF37) の "R"。16px でも読めるよう太字の幾何学的 path で描く。
       admin LoginPage の左上ロゴ (indigo-500 の正方形 + 白 R) と
       同じモノグラム流儀を、ブランドカラーの dark + gold に置き換えた。 -->
  <rect x="0" y="0" width="32" height="32" rx="7" ry="7" fill="#1b2528"/>
  <!-- "R" path: 縦軸 (left stem) + 上部ボウル + 下部の右脚 (leg)
       viewBox 32x32 の中で 8〜24 (= 16px 幅) に収まる。stroke ではなく
       fill で塗る方が小サイズで線が潰れない。 -->
  <path
    fill="#D4AF37"
    d="
      M 9 7
      L 9 25
      L 13 25
      L 13 18
      L 16.4 18
      L 20.2 25
      L 24.6 25
      L 20.3 17.3
      C 22.4 16.5 23.6 14.6 23.6 12.4
      C 23.6 9.2 21.3 7 17.6 7
      Z
      M 13 10.4
      L 17.4 10.4
      C 19.0 10.4 20.0 11.1 20.0 12.5
      C 20.0 13.9 19.0 14.6 17.4 14.6
      L 13 14.6
      Z
    "
  />
</svg>
