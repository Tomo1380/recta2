services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx-prod/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
      - laravel-public:/var/www/html/public:ro
    depends_on:
      - laravel
      - node
    networks:
      - recta2

  node:
    build:
      context: .
      dockerfile: docker/node.prod.dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4055
    networks:
      - recta2

  laravel:
    build:
      context: .
      dockerfile: docker/php.prod.dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
    volumes:
      - laravel-storage:/var/www/html/storage
      - laravel-public:/var/www/html/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - recta2

  scheduler:
    build:
      context: .
      dockerfile: docker/php.prod.dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
    volumes:
      - laravel-storage:/var/www/html/storage
    entrypoint: ["/bin/sh", "-c", "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recta2

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # Postgres reads POSTGRES_* from env_file directly — set those in .env.prod.
    env_file:
      - .env.prod
    volumes:
      - db-store:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - recta2

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-store:/data
    networks:
      - recta2

networks:
  recta2:
    driver: bridge

volumes:
  db-store:
  redis-store:
  laravel-storage:
  laravel-public:
  certbot-webroot:
