services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx-prod/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
      - laravel-public:/var/www/html/public:ro
    depends_on:
      - laravel
      - node
    networks:
      - recta2

  node:
    build:
      context: .
      dockerfile: docker/node.prod.dockerfile
      args:
        # Vite bakes VITE_* values into the bundle at build time, so they have
        # to come in via build args rather than runtime env.
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_LINE_OFFICIAL_ACCOUNT_ID: ${VITE_LINE_OFFICIAL_ACCOUNT_ID:-@043uxuen}
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - PORT=4055
      # SSR loader が内部ネットワーク経由で API へ到達するための絶対URL。
      # 未設定だと各 route の resolveApiBase が prod 分岐で空文字/throw になり、
      # 店舗詳細・コラム・用語集・LP の OGP/meta が SSR されない。
      - INTERNAL_API_BASE_URL=http://nginx:80
    networks:
      - recta2

  laravel:
    build:
      context: .
      dockerfile: docker/php.prod.dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
    volumes:
      - laravel-storage:/var/www/html/storage
      - laravel-public:/var/www/html/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - recta2

  scheduler:
    build:
      context: .
      dockerfile: docker/php.prod.dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
    volumes:
      - laravel-storage:/var/www/html/storage
    entrypoint: ["/bin/sh", "-c", "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recta2

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # Postgres reads POSTGRES_* from env_file directly — set those in .env.prod.
    env_file:
      - .env.prod
    environment:
      # Postgres 18 recommends keeping data in a subdirectory to allow
      # pg_upgrade --link across image versions without mount point issues.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-store:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - recta2

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-store:/data
    networks:
      - recta2

networks:
  recta2:
    driver: bridge

volumes:
  db-store:
  redis-store:
  laravel-storage:
  laravel-public:
  certbot-webroot:
