# Used only during initial Let's Encrypt certificate issuance.
# Replace with default.conf once certificates exist.
server {
    listen 80;
    server_name recta.isayama-dev.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'bootstrap OK\n';
        add_header Content-Type text/plain;
    }
}
