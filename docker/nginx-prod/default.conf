server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Let's Encrypt ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 内部の SSR (node コンテナ) が http で API を引けるように /api を直接処理する。
    # :80 を丸ごと HTTPS へ 301 すると、node の server-side fetch が
    # http://nginx:80/api → 301 → https://nginx (証明書不一致) で失敗し、
    # 店舗詳細などの OGP/meta が SSR されなくなる。そのため /api と
    # sitemap/robots だけは :80 でも素通しする (ページは下の catch-all で HTTPS へ)。
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /sitemap.xml {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }
    location = /robots.txt {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }
    location ~ \.php$ {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffering off;
        fastcgi_read_timeout 120s;
    }

    # それ以外のページは HTTPS へ
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name recta.isayama-dev.com;

    ssl_certificate     /etc/letsencrypt/live/recta.isayama-dev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recta.isayama-dev.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # nginx バージョンを隠す
    server_tokens off;

    # ─── セキュリティヘッダ (全レスポンス共通 / always で error 時も付与) ───
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    # CSP は許容寄り (inline/eval を許可しないと React Router の hydration と
    # Google Maps が壊れる)。clickjacking / base-uri / object-src は固める。
    # 締めるときは nonce + report-only で段階移行する。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://*.gstatic.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://www.tiktok.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    client_max_body_size 20M;

    root /var/www/html/public;
    index index.php index.html;

    # Laravel API
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # SSE (AIチャットのストリーム) — バッファリング無効で開きっぱなしにする
    location = /api/chat/stream {
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_buffering off;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    # SEO: sitemap.xml / robots.txt を Laravel コントローラで動的生成
    location = /sitemap.xml {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }
    location = /robots.txt {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }

    location ~ \.php$ {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffering off;
        fastcgi_read_timeout 120s;
    }

    # Laravel public storage (uploaded images etc)
    location /storage {
        try_files $uri =404;
    }

    # React Router SSR
    location / {
        proxy_pass http://node:4055;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://node:4055;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.ht {
        deny all;
    }
}
