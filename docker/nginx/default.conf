server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    # Laravel API routes
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # SEO: sitemap.xml と robots.txt を Laravel コントローラで動的生成。
    # 同名の Laravel ルートが web.php に登録されているので、index.php に
    # 直接 FastCGI で渡せば routing が解決する。
    location = /sitemap.xml {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }
    location = /robots.txt {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }

    # SSE endpoint — disable proxy + fastcgi buffering and let the response
    # stay open long enough for the typewriter stream.
    location = /api/chat/stream {
        try_files $uri $uri/ /index.php?$query_string;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Laravel PHP processing
    location ~ \.php$ {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffering off;
        fastcgi_read_timeout 120s;
        fastcgi_keep_conn on;
    }

    # React Router v7 (SSR) - all other routes
    location / {
        proxy_pass http://node:4055;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static file caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://node:4055;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny .htaccess only (hidden files served via Node proxy are safe)
    location ~ /\.ht {
        deny all;
    }
}
